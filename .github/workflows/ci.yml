name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Shiftvert.sln

      - name: Build (Release)
        run: dotnet build Shiftvert.sln -c Release --no-restore

      - name: Test (Release)
        run: dotnet test Shiftvert.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  msix:
    # Separate job so a packaging problem never hides a converter regression.
    runs-on: windows-latest
    timeout-minutes: 30
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build unsigned MSIX (${{ matrix.platform }})
        run: >
          dotnet build src/Shiftvert.App -c Release
          -p:Platform=${{ matrix.platform }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          -p:AppxBundle=Never

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.platform }}
          path: src/Shiftvert.App/AppPackages/**/*.msix
          if-no-files-found: error
