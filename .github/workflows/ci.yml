name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Same commands as scripts/build.ps1 -Configuration Release -Test
      - name: Restore
        run: dotnet restore Shiftvert.sln

      - name: Build (Release)
        run: dotnet build Shiftvert.sln -c Release --no-restore

      # Tests that need a codec this runner lacks (HEIC/HEVC encoders, ...) skip themselves via [SkipIfNoCapability].
      - name: Test (Release)
        run: dotnet test Shiftvert.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  msix:
    # Separate job so a packaging problem never hides a converter regression.
    # scripts/release.ps1 builds the x64 and ARM64 MSIX (each with the CLI bundled in cli\), bundles them with makeappx and writes
    # SHA256SUMS.txt. No certificate is available here, so the bundle is UNSIGNED: it cannot be installed, it proves that packaging works.
    runs-on: windows-latest
    timeout-minutes: 45
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build unsigned .msixbundle
        shell: pwsh
        run: ./scripts/release.ps1

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: shiftvert-msixbundle-unsigned
          path: |
            artifacts/*.msixbundle
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          # The bundle is ~300 MB and already compressed.
          compression-level: 0
          retention-days: 14
